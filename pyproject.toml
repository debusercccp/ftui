[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ftui"
version = "0.1.0"
description = "Dual-pane TUI file transfer client - prompt_toolkit + rich backend"
requires-python = ">=3.11"
dependencies = [
    "prompt_toolkit>=3.0",
    "rich>=13",
    "paramiko>=3.4",
]

[project.scripts]
ftui = "ftui.app:main"
